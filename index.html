function kFormUpdate(){
  if(!$("#kName")) return; const d=kFormRead();
  const known=d.conns.some(c=>c.relation); const ch=[[d.name,"name"],[d.cell,"cell"],[d.email,"email"],[d.coName,"company"],[d.companyRole||d.title||d.type,"role or title"],[d.industry,"industry"],[d.expertise,"what they're great at"],[d.town||d.province,"town"],[known,"who knows them"]];
  const miss=ch.filter(c=>!c[0]).map(c=>c[1]); const pct=Math.round((ch.length-miss.length)/ch.length*100);
  $("#kScore").innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;font-size:14px"><b>Profile ${pct}%</b><span class="tag">${miss.length?`Next: ${esc(miss.slice(0,3).join(", "))}${miss.length>3?"…":""}`:"Complete. Great work."}</span></div><div class="meter"><span style="width:${pct}%"></span></div>`;
  $("#kTierHint").textContent = d.tier? TIERS[d.tier].desc : "Optional. A owns a business we might buy, B is an employee at a business or partner we know, C is a potential hire, D is an influential person or great contact to have.";
  $("#kCoHint").innerHTML = d.coName&&d.coFound? (()=>{ const co=companies().find(c=>c.name.toLowerCase()===d.coName.toLowerCase()); return isPartnerCo(co)? `Linked to <b>${esc(co.name)}</b> in Partners (${esc(PKINDS[co.kind]||"")}).` : `Linked to <b>${esc(co.name)}</b> in Businesses.`; })() : "";
  newCoUpdate(d);
  $("#kTalWrap").hidden=!$("#kTal").checked; $("#kWealthWrap").hidden=!$("#kHnwi").checked;
}
async function submitContact(){
  const d=kFormRead();
  if(!d.name){ toast("Add a name"); $("#kName").focus(); return; }
  const tier=d.tier || (OWNER_ROLES.includes(d.companyRole)?"A":"D"); const tags=(d.tags&&d.tags.length)? d.tags : [tier];
  const me=myPartner(); const primary=(d.conns.find(c=>c.partner===me)||d.conns[0]||{}).partner||"";
  const prev=FORM.id? S.contacts.get(FORM.id):null;
  const data={name:d.name, tier, tags, firm:d.firm, type:d.type, partner:primary, companyId:d.companyId, companyRole:d.companyRole, ownsCompanyId: OWNER_ROLES.includes(d.companyRole)? d.companyId : "", title:d.title, country:d.country, industry:d.industry, expertise:d.expertise, linkedin:d.linkedin, cell:d.cell, email:d.email, language:d.language, province:d.province, town:d.town, notes:d.notes, influence:d.influence, hnwi:d.hnwi, wealthSource:d.hnwi?d.wealthSource:"", doNotContact:d.doNotContact, talent:d.talent, example:prev?.example||false};
  Object.assign(data, ciRead(), bgRead(), otherRolesRead()); data.cells=readExtras("cell"); data.emails=readExtras("email");
  if(prev && prev.companyId && prev.companyId!==d.companyId){ const pc=S.companies.get(prev.companyId); data.pastRoles=[...(prev.pastRoles||[]),{company:pc?.name||"", role:prev.companyRole||prev.title||"", until:today()}]; }
  const id=FORM.id||newId();
  const nc=newCoChoice(d); let addBiz=false;
  if(nc.what==="partner"){ const cid=newId(); const by=await myName(); const g2=gazFind(d.town); if(!await dbSet("companies/"+cid,{name:d.coName, kind:nc.kind, status:"network", industry:PIND[nc.kind]||"", town:d.town, province:d.province, hqCountry:d.country||"South Africa", partner:primary, owners:[], fit:{}, signals:{}, source:{}, log:[{d:today(),by,text:`Added as partner firm via ${d.name}`}], createdByName:by})) return; data.companyId=cid; data.firm=""; }
  if(nc.what==="business" && nc.buy==="no"){ const cid=newId(); const by=await myName(); if(!await dbSet("companies/"+cid,{name:d.coName, kind:"other", status:"network", town:d.town, province:d.province, hqCountry:d.country||"South Africa", partner:primary, owners:[], fit:{}, signals:{}, source:{}, log:[{d:today(),by,text:`Added as ${d.name}'s workplace (not for acquisition)`}], createdByName:by})) return; data.companyId=cid; data.firm=""; }
  if(nc.what==="business" && nc.buy!=="no"){ addBiz=true; FORM.buyAs=nc.buy; }
  document.querySelectorAll('button[type=submit]').forEach(b=>b.disabled=true);
  const ok=await dbSet("contacts/"+id,data) && await saveConns(id,d.conns);
  document.querySelectorAll('button[type=submit]').forEach(b=>b.disabled=false);
  if(!ok) return;
  toast(FORM.id?"Saved":"Added to People");
  if(addBiz){ const b=FORM.buyAs; ownerDealForm(id,true); setTimeout(()=>{ const s=$("#cKind"); if(s){ s.value=b==="target"?"acquire":"network"; s.dispatchEvent(new Event("change",{bubbles:true})); } },60); return; }
  if(sheetOpen() && S.sheet?.kind==="contact" && S.sheet.id===id){ closeModal(); renderSheet(); } else openSheet("contact",id,true);
}

function filteredDeals(){
  const f=S.f, q=f.q.trim().toLowerCase();
  return companies().filter(c=>{
    if(!isAcq(c)) return false;
    const g=grp(c);
    if(f.group==="likely"){ if(!likelySeller(c)||g==="closed"||g==="won") return false; } else if(f.group && g!==f.group) return false;
    if(f.mine && !isMine(c)) return false;
    if(f.sector && sectorOf(c)!==f.sector) return false;
    if(f.partner && c.partner!==f.partner) return false;
    if(f.province && c.province!==f.province) return false;
    if(f.channel && c.source?.channel!==f.channel) return false;
    if(f.lang){ const ls=companyLangs(c); if(!(ls.includes(f.lang)||ls.includes("both"))) return false; }
    if(q){ const hay=[c.name,c.tradingAs,c.town,c.province,c.industry,c.notes,c.partner,sourceText(c),...(c.owners||[]).flatMap(o=>[o.name,o.email,o.cell]),...peopleAt(c).map(k=>k.name)].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  }).sort((a,b)=>{ const x=a.nextCheckIn||"9999", y=b.nextCheckIn||"9999"; return x.localeCompare(y) || (a.name||"").localeCompare(b.name||""); });

const last9=s=>String(s||"").replace(/\D/g,"").slice(-9);
async function syncOwnersToPeople(cid, owners, biz, skipId){
  let made=0;
  for(const o of owners||[]){
    const nm=String(o.name||"").trim(); if(!nm) continue;

    if(same){ if(!same.companyId) await dbUpdate("contacts/"+same.id,{companyId:cid, companyRole:o.role||"Owner", ownsCompanyId:cid, firm:"", tier:same.tier||"A"}); continue; }
    const ok=await dbSet("contacts/"+newId(),{name:nm, tier:"A", type:"Business owner", companyId:cid, companyRole:o.role||"Owner", ownsCompanyId:cid, firm:"", cell:o.cell||"", email:o.email||"", language:o.language||"af", partner:biz.partner||"", town:biz.town||"", province:biz.province||"", country:biz.hqCountry||"South Africa", influence:0, notes:""});

function minutesText(m){
  const L=[]; const nm=id=>S.companies.get(id)?.name||"?";
  L.push(`MUNGER TARGET MEETING · ${fmtD(m.held_on)}${m.title?` · ${m.title}`:""}`);
  if((m.attendees||[]).length) L.push(`Present: ${m.attendees.join(", ")}`);
  const rv=Object.entries(m.review||{}); if(rv.length){ L.push("","Actions reviewed"); rv.forEach(([cid,r])=>{ const c=S.commitments.find(x=>x.id===cid); if(c) L.push(`• ${c.owner}: ${c.action} – ${REV[r.s]?.[0]||r.s}${r.note?` (${r.note})`:""}`); }); }
  const decs=(m.decisions||[]); if(decs.length){ L.push("","Pipeline decisions"); decs.forEach(d=>L.push(`• ${nm(d.companyId)}: ${({chase:"CHASE",keep:"KEEP WARM",drop:"DROP",new:"NEW TARGET"})[d.decision]||d.decision}`)); }
  const added=m.status==="open"? targetsAddedIn(m) : (m.new_targets||[]); if(m.status==="open"&&added.length){ L.push("","New targets"); added.forEach(c=>L.push(`• ${c.name}`)); }
  if((m.items||[]).length){ L.push("","Discussion"); m.items.forEach(it=>L.push(`• ${it.topic}${it.notes?`: ${it.notes.replace(/\n+/g," ")}`:""}`)); }
  const cm=S.commitments.filter(c=>c.meetingId===m.id); L.push("","New actions"); cm.length? cm.forEach(c=>L.push(`• ${c.owner}: ${c.action}${c.due?` (by ${fmtD(c.due)})`:""}`)) : L.push("• None");
  if(m.notes) L.push("","Notes",m.notes);
  if(m.next_date) L.push("",`Next meeting: ${fmtD(m.next_date)}`);
  return L.join("\n");
}

/* ================= Phase 7: no duplicates ================= */
function normName(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim(); }
function nameKeyLoose(s){ const t=normName(s).split(" ").filter(Boolean); return t.length>=2? t[0]+" "+t[t.length-1] : t.join(" "); }
function dupPeople(d, exceptId){
  const out=[]; const p=phoneKey(d.cell), em=String(d.email||"").trim().toLowerCase(), nk=normName(d.name), nl=nameKeyLoose(d.name);
  contacts().forEach(k=>{ if(k.id===exceptId) return; const why=[];
    if(p && phoneKey(k.cell)===p) why.push("same cell number");
    if(em && String(k.email||"").trim().toLowerCase()===em) why.push("same email");
    if(nk && (normName(k.name)===nk || (nl.includes(" ") && nameKeyLoose(k.name)===nl))) why.push("same name");
    if(why.length) out.push({k, why, strong:why.some(w=>w!=="same name")}); });
  return out.sort((a,b)=>b.strong-a.strong);
}
function dupCompany(name, exceptId){ const n=normName(name); return n? companies().find(c=>c.id!==exceptId && normName(c.name)===n) : null; }

/* ================= Phase 9: "Did you mean…?" for near-matches ================= */
const CO_STOP=new Set(["pty","ltd","limited","inc","incorporated","sa","cc","co","company","group","holdings","holding","the","rf","plc","llc","and","south","africa","za","pvt","proprietary"]);
function lev(a,b){ if(a===b) return 0; const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
const coTokens=s=>normName(s).split(" ").filter(t=>t&&!CO_STOP.has(t));
function similarCo(a,b){
  const ta=coTokens(a), tb=coTokens(b); if(!ta.length||!tb.length) return false;
  const A=ta.join(" "), B=tb.join(" "); if(A===B) return true;
  if(A.replace(/ /g,"")===B.replace(/ /g,"")) return true;
  const [sh,lo]=ta.length<=tb.length?[ta,tb]:[tb,ta];
  if(sh[0]===lo[0] && sh.every(t=>lo.includes(t)) && sh.join("").length>=3) return true;
  const L=Math.max(A.length,B.length); return L>=5 && (1-lev(A,B)/L)>=0.8;
}
function fuzzyCompanies(name, exceptId){ const n=normName(name); if(!n||n.length<3) return []; return companies().filter(c=>c.id!==exceptId && normName(c.name)!==n && similarCo(name,c.name)).slice(0,4); }
function similarPerson(a,b){
  const ta=normName(a).split(" ").filter(Boolean), tb=normName(b).split(" ").filter(Boolean); if(!ta.length||!tb.length) return false;
  const A=ta.join(" "), B=tb.join(" "); if(A===B) return false;
  if(ta.length>=2 && tb.length>=2){ const la=ta[ta.length-1], lb=tb[tb.length-1], fa=ta[0], fb=tb[0];
    const ml=Math.min(la.length,lb.length); const lastOk= la===lb || (ml>=4 && lev(la,lb)<=(ml>=6?2:1));
    const firstOk= fa===fb || lev(fa,fb)<=2 || (Math.min(fa.length,fb.length)>=2 && (fa.startsWith(fb)||fb.startsWith(fa)));
    if(lastOk && firstOk) return true; }
  const L=Math.max(A.length,B.length); return L>=6 && (1-lev(A,B)/L)>=0.85;
}

const IS_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const IS_STANDALONE=(()=>{ try{ return navigator.standalone===true || matchMedia("(display-mode: standalone)").matches; }catch(_){ return false; } })();
function micHint(ta, msg){

startMic=function(btn){
  const ta=document.getElementById(btn.dataset.for); if(!ta) return;
  if(REC){ try{ REC.stop(); }catch(e){} return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const keyboardWay=()=>{ ta.focus(); micHint(ta, IS_IOS? "Tap the <b>🎤 microphone on your keyboard</b> (bottom right) and speak – it types straight into this box. The Wispr Flow keyboard works too." : "Tap the <b>🎤 microphone on your keyboard</b> and speak – it types straight into this box."); };
  if(!SR || (IS_IOS && IS_STANDALONE)){ keyboardWay(); return; }
  let r; try{ r=new SR(); }catch(_){ keyboardWay(); return; }
  r.lang=voiceLang(); r.continuous=!IS_IOS; r.interimResults=true;
  const base=ta.value? ta.value.replace(/\s*$/,"")+" " : ""; let fin="", got=false;
  const dog=setTimeout(()=>{ if(!got){ try{ r.abort(); }catch(_){} keyboardWay(); } },7000);
  r.onresult=e=>{ got=true; let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) fin+=t.trim()+" "; else interim+=t; } ta.value=(base+fin+interim); ta.dispatchEvent(new Event("input",{bubbles:true})); };
  r.onerror=ev=>{ clearTimeout(dog); if(ev.error==="no-speech") { toast("Didn't hear anything – try again"); return; } if(ev.error==="aborted") return; keyboardWay(); };
  r.onend=()=>{ clearTimeout(dog); REC=null; if(REC_BTN){ REC_BTN.classList.remove("rec"); } REC_BTN=null; ta.value=ta.value.trim(); ta.dispatchEvent(new Event("input",{bubbles:true})); ta.dispatchEvent(new Event("change",{bubbles:true})); };
  REC=r; REC_BTN=btn; btn.classList.add("rec");
  try{ r.start(); toast("Listening… tap Stop when done"); }catch(_){ clearTimeout(dog); REC=null; btn.classList.remove("rec"); keyboardWay(); }
};

function mentionHit(hay,terms){ for(const t of terms){ const i=hay.search(new RegExp("\\b"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i")); if(i>=0){ const s=Math.max(0,i-40); return "…"+hay.slice(s,i+t.length+60).replace(/\s+/g," ").trim()+"…"; } } return ""; }

  const inTown=t=>lc(t)===V || (g && gazFind(t)===g);
  const inProv=(t,p)=>lc(p)===V || lc(gazFind(t)?.region)===V;
  const inCountry=(c)=>lc(c)===V;
  contacts().forEach(k=>{ const why=[]; const co=companyOf(k);
    if(mode==="town"){ if(inTown(k.town)) why.push(`Based in ${k.town}`); if(co && inTown(co.town)) why.push(`Works at ${co.name} (${co.town})`); }
    if(mode==="province"){ if(inProv(k.town,k.province)) why.push(`Based in ${[k.town,k.province].filter(Boolean).join(", ")}`); if(co && inProv(co.town,co.province)) why.push(`Works at ${co.name} (${[co.town,co.province].filter(Boolean).join(", ")})`); }
    if(mode==="country"){ if(inCountry(k.country)) why.push(`Based in ${k.country}`); if(co && (inCountry(co.hqCountry)||lc(co.countries).includes(V))) why.push(`Works at ${co.name}`); }
    const m=mentionHit(recHay(k,true),terms); if(m) why.push(`Mentioned: ${m}`);
    if(why.length) out.push({t:"k",r:k,why}); });
  companies().forEach(c=>{ const why=[];
    if(mode==="town" && inTown(c.town)) why.push(`Based in ${c.town}`);
    if(mode==="province" && inProv(c.town,c.province)) why.push(`Based in ${[c.town,c.province].filter(Boolean).join(", ")}`);
    if(mode==="country"){ if(inCountry(c.hqCountry)) why.push(`Head office in ${c.hqCountry}`); else if(lc(c.countries).includes(V)) why.push(`Trades in ${val}`); }
    const m=mentionHit(recHay(c,false),terms); if(m) why.push(`Mentioned: ${m}`);

function townCounts(){ const m=new Map();
  const bump=(t,id)=>{ const g=gazFind(t); if(!g) return; if(!m.has(g.name)) m.set(g.name,{g,ids:new Set()}); m.get(g.name).ids.add(id); };
  contacts().forEach(k=>{ bump(k.town,"k"+k.id); const co=companyOf(k); if(co) bump(co.town,"k"+k.id); });
  companies().forEach(c=>bump(c.town,"c"+c.id));
  const hays=[...contacts().map(k=>["k"+k.id,recHay(k,true)]),...companies().map(c=>["c"+c.id,recHay(c,false)])];
  GAZ.forEach(g=>{ const terms=townAliases(g.name); hays.forEach(([id,h])=>{ const hl=lc(h); if(terms.some(t=>hl.includes(t)) && mentionHit(h,terms)){ if(!m.has(g.name)) m.set(g.name,{g,ids:new Set()}); m.get(g.name).ids.add(id); } }); });
  return [...m.values()].map(x=>({g:x.g,n:x.ids.size}));
}

const OFF={q:"munger.outbox.v1", c:"munger.cache.v1:", u:"munger.uid"};

const CACHE_TABLES=new Set(["companies","contacts","settings","connections","commitments","meetings","person_links","members"]);

const realFrom=sb.from.bind(sb);

function prepChain(table,chain){
  if(table==="settings") return chain;
  return chain.map(([m,a])=>{ if(m!=="insert"&&m!=="upsert") return [m,a];
    const fix=r=>(r&&typeof r==="object"&&!r.id)?{...r,id:newId()}:r;
    return [m,[Array.isArray(a[0])?a[0].map(fix):fix(a[0]),...a.slice(1)]]; });
}
function applyLocal(table,chain){
  const op=chain.find(([m])=>WRITES.has(m)); if(!op) return; const [m,a]=op;
  const eqs=chain.filter(([x])=>x==="eq").map(([,args])=>args);
  const match=r=>eqs.every(([c,v])=>String(r[c])===String(v));
  const pk=table==="settings"?"key":"id"; const now=new Date().toISOString();
  const keys=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith(OFF.c+table+"|")) keys.push(k); }
  keys.forEach(k=>{ const c=offRead(k); if(!c||!Array.isArray(c.d)) return; let d=c.d;
    if(m==="insert"||m==="upsert"){ (Array.isArray(a[0])?a[0]:[a[0]]).forEach(row=>{ const j=d.findIndex(r=>row[pk]!=null && r[pk]===row[pk]); if(j>=0) d[j]={...d[j],...row,updated_at:now}; else d.push({...(m==="insert"?INSERT_DEFAULTS[table]:{}),created_at:now,updated_at:now,created_by:S.uid,...row}); }); }
    else if(m==="update") d=d.map(r=>match(r)?{...r,...a[0],updated_at:now}:r);

function queueOp(table,chain){

}
async function execChain(table,chain){
  const isW=chain.some(([m])=>WRITES.has(m));

    chain=prepChain(table,chain);
    if(!navigator.onLine || outbox().length){ queueOp(table,chain); if(navigator.onLine) setTimeout(flushOutbox,200); return {data:null,error:null,status:202,statusText:"queued"}; }
    let r; try{ r=await buildQ(table,chain); }catch(e){ r={data:null,error:e}; }
    if(r && r.error && isNetErr(r.error)){ setNet(false); queueOp(table,chain); return {data:null,error:null,status:202,statusText:"queued"}; }
    if(r && !r.error) setNet(true);
    return r;
  }
  const key=OFF.c+table+"|"+JSON.stringify(chain);
  let r; try{ r=await buildQ(table,chain); }catch(e){ r={data:null,error:e}; }
  if(r && !r.error){ setNet(true); if(CACHE_TABLES.has(table) && chain[0]?.[0]==="select"){ let d=r.data; // keep changes still waiting to sync visible

async function flushOutbox(manual){

  let sess=null; try{ sess=(await sb.auth.getSession())?.data?.session||null; }catch(_){}

      if(r && r.error && isNetErr(r.error)){ setNet(false); break; }

const TILESETS=[
  {name:"Map", url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png", o:{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}},

  {name:"Satellite", url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", o:{maxZoom:18,attribution:'Imagery &copy; Esri'}}

function townGroups(){ const m=new Map();
  const bump=(t,id)=>{ const g=gazFind(t); if(!g) return; if(!m.has(g.name)) m.set(g.name,{g,ids:new Set()}); m.get(g.name).ids.add(id); };
  contacts().forEach(k=>{ bump(k.town,"k"+k.id); const co=companyOf(k); if(co) bump(co.town,"k"+k.id); });
  companies().forEach(c=>bump(c.town,"c"+c.id));
  const hays=[...contacts().map(k=>["k"+k.id,recHay(k,true)]),...companies().map(c=>["c"+c.id,recHay(c,false)])];
  GAZ.forEach(g=>{ const terms=townAliases(g.name); hays.forEach(([id,h])=>{ const hl=lc(h); if(terms.some(t=>hl.includes(t)) && mentionHit(h,terms)){ if(!m.has(g.name)) m.set(g.name,{g,ids:new Set()}); m.get(g.name).ids.add(id); } }); });
  return [...m.values()].map(x=>({g:x.g,ids:[...x.ids],n:x.ids.size}));
}

let PLEL=null;
function plMarkers(map){
  if(map._munLayer){ map.removeLayer(map._munLayer); } const grpL=L.layerGroup().addTo(map); map._munLayer=grpL;
  const pts=townGroups();
  pts.forEach(p=>{ const sel=S.pl.mode==="town" && lc(S.pl.val)===lc(p.g.name); const s=Math.round(24+Math.min(22,p.n*2.5));
    const icon=L.divIcon({className:"mdot-wrap",html:`<div class="mdot${sel?" sel":""}${p.g.abroad?" abroad":""}" style="width:${s}px;height:${s}px">${p.n}</div>`,iconSize:[s,s],iconAnchor:[s/2,s/2]});
    const mk=L.marker([p.g.lat,p.g.lng],{icon,title:`${p.g.name}: ${p.n}`,riseOnHover:true}).addTo(grpL);
    mk.bindTooltip(`${p.g.name} · ${p.n}`,{direction:"top",offset:[0,-s/2]}); mk.on("click",()=>plSelect(p)); });

}
initPlacesMap=function(){
  const ph=document.getElementById("plMap"); if(!ph || typeof L==="undefined") return;
  if(PLMAP && PLEL){ if(ph!==PLEL) ph.replaceWith(PLEL); setTimeout(()=>{ try{ PLMAP.invalidateSize(); }catch(_){} },30); plMarkers(PLMAP); return; }
  const map=L.map(ph,{zoomControl:true,attributionControl:true,zoomAnimation:true,fadeAnimation:true,markerZoomAnimation:true,tap:false,worldCopyJump:true}); PLMAP=map; PLEL=ph;
  const layers=TILESETS.map(t=>L.tileLayer(t.url,t.o));
  let cur=0, loaded=false, errs=0; layers[0].addTo(map);
  const watch=(ly,i)=>{ ly.on("tileload",()=>{ loaded=true; ph.classList.remove("notiles"); }); ly.on("tileerror",()=>{ if(loaded||i!==cur) return; if(++errs>=4){ errs=0; if(cur<layers.length-1){ map.removeLayer(layers[cur]); cur++; layers[cur].addTo(map); } else ph.classList.add("notiles"); } }); };
  layers.forEach(watch);
  L.control.layers(Object.fromEntries(TILESETS.map((t,i)=>[t.name,layers[i]])),null,{position:"topright"}).addTo(map);
  map.on("baselayerchange",ev=>{ cur=layers.indexOf(ev.layer); });
  const pts=plMarkers(map);
  if(S.pl.center) map.setView(S.pl.center,S.pl.zoom||5);
  else if(pts.length>1) map.fitBounds(L.latLngBounds(pts.map(p=>[p.g.lat,p.g.lng])).pad(.25),{maxZoom:9});
  else if(pts.length===1) map.setView([pts[0].g.lat,pts[0].g.lng],9);
  else map.setView([-29,24.5],5);
  map.on("moveend",()=>{ S.pl.center=map.getCenter(); S.pl.zoom=map.getZoom(); });
  setTimeout(()=>{ if(PLMAP===map) try{ map.invalidateSize(); }catch(_){} },60);
  if(!navigator.onLine) ph.classList.add("notiles");
};

/* ---------- 8. Search inside every long dropdown (people, companies, partners) ---------- */
const ssNorm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const ssSpecial=v=>!v || /^_|^\+|^new$/i.test(v);
function ssFilter(sel,inp){
  const q=ssNorm(inp.value).trim(); const words=q.split(/\s+/).filter(Boolean);
  if(!sel._ssOrig) sel._ssOrig=[...sel.childNodes].map(n=>n.cloneNode(true));
  const cur=sel.value; sel.innerHTML="";
  if(!words.length){ sel._ssOrig.forEach(n=>sel.appendChild(n.cloneNode(true))); sel._ssOrig=null; sel.value=cur; inp.classList.remove("nohit"); return; }
  let first=null, hits=0;
  const keep=(o,grp)=>{ const v=o.value; if(ssSpecial(v) || v===cur) return true; const hay=ssNorm(o.textContent+" "+(grp||"")); return words.every(w=>hay.includes(w)); };
  sel._ssOrig.forEach(n=>{
    if(n.tagName==="OPTGROUP"){ const g=n.cloneNode(false); [...n.children].forEach(o=>{ if(keep(o,n.label)){ g.appendChild(o.cloneNode(true)); if(!ssSpecial(o.value)){ hits++; first=first||o.value; } } }); if(g.children.length) sel.appendChild(g); }

  groups.forEach(set=>{ const ids=[...set]; if(ids.length<2) return; if(ids.length<=6){ for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++) add(ids[i],ids[j]); } else ids.forEach((id,i)=>add(id,ids[(i+1)%ids.length])); }); }; }

{ const base=listRows; listRows=function(){ const L=S.lists; const rows=base(); if(!L.groups.length) return rows;

    peopleAt(c).forEach(k=>{ if(k.doNotContact) return; if(L.lang!=="all" && !(k.language===L.lang||k.language==="both")) return;
      const email=k.email||(k.emails||[])[0]?.v||"", cell=k.cell||(k.cells||[])[0]?.v||""; if(!email&&!cell) return; const key=(email||cell).toLowerCase(); if(seen.has(key)) return; seen.add(key);

/* ---------- 34. Follow-ups done properly: what actually happened, when, editable, and a clear activity timeline ---------- */
const ACT={checkin:{l:"We spoke / met",short:"Spoke / met",ic:"✓",pre:"Checked in"},attempt:{l:"No answer / left a message",short:"No answer",ic:"☎",pre:"Tried to reach them"},cancelled:{l:"Cancelled or postponed",short:"Cancelled / postponed",ic:"✕",pre:"Cancelled / postponed"},note:{l:"Just a note",short:"Note",ic:"✎",pre:""},meeting:{l:"Target meeting",short:"Target meeting",ic:"★",pre:""}};
function actType(e){ if(e.type&&ACT[e.type]) return e.type; const t=e.text||""; if(/^(Checked in|🎉 Deal done|Sold to|Not for us any more)/.test(t)) return "checkin"; if(/^Target meeting/.test(t)) return "meeting"; return "note"; }
function actBody(e){ return String(e.text||"").replace(/^(Checked in|Tried to reach them|Cancelled \/ postponed):?\s*/,"").replace(/^ ?·\s*/,""); }
const NOISE=/^(Captured|Added as|Details added|Stage:|Linked to|Started a conversation)/;

   <div class="fields" style="margin:10px 0 6px"><div class="fld"><label for="ci19D">When</label><input type="date" id="ci19D" value="${today()}" max="${today()}"></div></div>`); }; }

{ const base=dbUpdate; dbUpdate=async function(path,patch){

function closedCm(mine){ const me=myPartner(); return S.commitments.filter(x=>cmLive(x) && ["done","not_done"].includes(x.status) && (!mine||x.owner===me) && daysSince((x.updatedAt||"").slice(0,10))<=7).sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||"")); }
function closedCmHTML(mine){ const L=closedCm(mine); if(!L.length) return "";
  return `<details class="histd" style="margin-top:6px"><summary>Closed this week (${L.filter(x=>x.status==="done").length} done · ${L.filter(x=>x.status==="not_done").length} not done)</summary><div class="group" style="margin-top:8px">${L.map(x=>`<div class="rowi"><span class="tlic19 ${x.status==="done"?"ok":"no"}">${x.status==="done"?"✓":"✕"}</span><span class="main"${S.readOnly?"":` role="button" tabindex="0" data-act="cm19-edit" data-id="${esc(x.id)}" style="cursor:pointer"`}><span class="t1" style="display:block;white-space:normal">${esc(x.action)}</span><span class="t2" style="display:block">${esc([x.owner, x.status==="done"?"Done":`Not done${x.why?`: ${x.why}`:""}`].filter(Boolean).join(" · "))}</span></span></div>`).join("")}</div></details>`; }

/* ================= Phase 20: Investment scorecard on every business we'd buy ================= */
/* 10 criteria scored automatically from the numbers you enter; Proceed (>60) / Debate (50–60) / Kill (<50); EBIT below 10% kills; largest client over 30% is a red flag */
const SC=[
 {k:"rev",  n:"Revenue growth – 3 yr CAGR", unit:"%", type:"num", hint:"e.g. 8", bands:[[x=>x<0,0,"<0%"],[x=>x<5,5,"0–5%"],[x=>x<10,7,"5–10%"],[x=>x<=15,9,"10–15%"],[x=>true,10,">15%"]]},
 {k:"ebitdag",n:"EBITDA growth – 3 yr CAGR", unit:"%", type:"num", hint:"e.g. 12", bands:[[x=>x<0,0,"<0%"],[x=>x<5,5,"0–5%"],[x=>x<10,7,"5–10%"],[x=>x<=15,9,"10–15%"],[x=>true,10,">15%"]]},
 {k:"gp",   n:"GP% – material", unit:"%", type:"num", hint:"e.g. 45", bands:[[x=>x<30,0,"<30%"],[x=>x<40,5,"30–40%"],[x=>x<50,7,"40–50%"],[x=>x<=60,9,"50–60%"],[x=>true,10,">60%"]]},
 {k:"ebit", n:"EBIT% (min 10%) – adjusted", unit:"%", type:"num", hint:"e.g. 14", bands:[[x=>x<10,0,"<10%",{kill:true}],[x=>x<13,6,"10–13%"],[x=>x<16,7,"13–16%"],[x=>x<=20,9,"16–20%"],[x=>true,10,">20%"]]},
 {k:"rona", n:"RONA – EBIT / (NWC + FA)", unit:"%", type:"num", hint:"e.g. 25", bands:[[x=>x<15,0,"<15%"],[x=>x<20,4,"15–20%"],[x=>x<30,6,"20–30%"],[x=>x<=40,8,"30–40%"],[x=>true,10,">40%"]]},
 {k:"fit",  n:"Platform fit", type:"pick", opts:[["no",0,"No fit"],["medium",5,"Medium fit"],["good",8,"Good fit"],["excellent",10,"Excellent fit"]]},
 {k:"cash", n:"Day-one cash equity (× EBIT)", unit:"×", type:"num", hint:"e.g. 1.6", bands:[[x=>x>2.8,0,">2.8×"],[x=>x>=2.4,4,"2.4–2.8×"],[x=>x>=1.75,7,"1.75–2.4×"],[x=>x>=1.25,8,"1.25–1.75×"],[x=>true,10,"<1.25×"]]},
 {k:"def",  n:"Defensibility", type:"pick", opts:[["poor",0,"Poor"],["low",3,"Low"],["medium",5,"Medium"],["high",7,"High"],["vhigh",10,"Very high"]]},
 {k:"conc", n:"Customer concentration – largest client % of sales", unit:"%", type:"num", hint:"e.g. 18", bands:[[x=>x>30,0,">30%",{flag:true}],[x=>x>=20,3,"20–30%"],[x=>x>=10,6,"10–20%"],[x=>true,10,"<10%"]]},
 {k:"price",n:"Price (PV PBIAT multiple)", unit:"×", type:"num", hint:"e.g. 9.5", bands:[[x=>x>13,2,">13×"],[x=>x>=11,6,"11–13×"],[x=>x>=10,8,"10–11×"],[x=>x>=8,9,"8–10×"],[x=>true,10,"<8×"]]}];
const VERD={proceed:{l:"Proceed",cls:"v-go",t:"Score above 60 – pursue it heavily."},debate:{l:"Debate",cls:"v-deb",t:"Score 50–60 – discuss at the target meeting before spending more time."},kill:{l:"Kill",cls:"v-kill",t:"Score below 50 – spend the time on something else."}};
function scLine(def,inp){ if(!inp||inp.v===""||inp.v==null) return null; if(def.type==="pick"){ const o=def.opts.find(o=>o[0]===inp.v); return o?{pts:o[1],band:o[2]}:null; }
  const x=parseFloat(String(inp.v).replace(",",".").replace(/[%x×\s]/gi,"")); if(!isFinite(x)) return null; const b=def.bands.find(b=>b[0](x)); return {pts:b[1],band:b[2],kill:!!b[3]?.kill,flag:!!b[3]?.flag}; }
function scoreOf(c){ const I=c?.scorecard?.inputs||{}; let total=0,done=0,kill=false; const flags=[];
  const lines=SC.map(d=>{ const r=scLine(d,I[d.k]); if(r){ total+=r.pts; done++; if(r.kill) kill=true; if(r.flag) flags.push(d.n); } return {d,r,inp:I[d.k]}; });
  return {total,done,kill,flags,lines,verdict: kill? "kill" : total>60? "proceed" : total>=50? "debate" : "kill"}; }
function scoreCardHTML(c,ro){ const s=scoreOf(c); const v=VERD[s.verdict];
  if(!s.done) return `<div class="fsec">Investment scorecard</div><div class="card box"><div class="tag">Not scored yet. Score it on the 10 criteria – growth, margins, RONA, platform fit, day-one cash equity, defensibility, customer concentration and price – to see whether to proceed, debate or kill.</div>${ro?"":`<button class="btn primary block" data-act="sc20" data-id="${esc(c.id)}" style="margin-top:10px">Score this business</button>`}</div>`;
  return `<div class="fsec">Investment scorecard</div><div class="card box sc20card" ${ro?"":`role="button" tabindex="0" data-act="sc20" data-id="${esc(c.id)}"`}>
   <div class="scsum"><div class="scnum ${v.cls}">${s.total}<small>/100</small></div><div><div class="scverd ${v.cls}">${v.l}${s.kill?" – EBIT below 10%":""}</div><div class="tag">${esc(v.t)}${s.done<10?` Provisional – ${s.done} of 10 scored.`:""}</div>${s.flags.length?`<div class="scflag">⚑ Red flag: largest client is over 30% of sales</div>`:""}</div></div>
   <div class="scbar"><span style="width:${s.total}%"></span><i style="left:50%"></i><i style="left:60%"></i></div>
   <div class="sclines">${s.lines.map(({d,r,inp})=>`<div class="scl"><span>${esc(d.n)}</span><b>${r?r.pts:"–"}</b><small>${r?`${esc(d.type==="pick"?r.band:`${inp.v}${d.unit} · ${r.band}`)}${inp?.reason?` – ${esc(inp.reason)}`:""}`:"not scored"}${r?.kill?` <em class="red">kill</em>`:""}${r?.flag?` <em class="red">red flag</em>`:""}</small></div>`).join("")}</div>
   <div class="tag" style="margin-top:8px">${c.scorecard?.by?`Scored by ${esc(c.scorecard.by)} · ${esc(fmtD(c.scorecard.d||""))}`:""}${ro?"":" · tap to update"}</div></div>`; }
function scModal(id){ const c=S.companies.get(id); if(!c) return; const I=c.scorecard?.inputs||{};
  showModal(`${ovHead("Investment scorecard",`<button class="hbtn" data-act="close-modal">Cancel</button>`)}<div class="ovb">
   <p style="margin:0 2px 8px"><b>${esc(c.name)}</b> – enter the numbers; the points and the total work themselves out.</p>
   <div class="scsticky" id="scLive"></div>
   ${SC.map((d,i)=>`<div class="card box scq"><div class="lbl">${i+1}. ${esc(d.n)}</div>
     ${d.type==="pick"? `<div class="chips">${d.opts.map(o=>`<button type="button" class="chip ${I[d.k]?.v===o[0]?"on":""}" data-act="sc20-pick" data-k="${d.k}" data-v="${o[0]}">${esc(o[2])} <span class="n">${o[1]}</span></button>`).join("")}</div>`
       : `<div class="scin"><input type="text" inputmode="decimal" id="sc_${d.k}" value="${esc(I[d.k]?.v??"")}" placeholder="${esc(d.hint)}" aria-label="${esc(d.n)}"><span>${d.unit}</span><b id="scp_${d.k}"></b></div><div class="scbands">${d.bands.map(b=>`<span>${esc(b[2])} → ${b[3]?.kill?"kill":b[3]?.flag?"red flag":b[1]}</span>`).join("")}</div>`}
     <input type="text" class="screason" id="scr_${d.k}" value="${esc(I[d.k]?.reason||"")}" placeholder="Reason (optional)"></div>`).join("")}
   <button class="btn primary block" data-act="sc20-save" data-id="${esc(id)}" style="margin-top:12px">Save scorecard</button>
   ${Object.keys(I).length?`<button class="linkbtn" data-act="sc20-clear" data-id="${esc(id)}" style="margin-top:8px;color:var(--bad,#b3261e)">Clear the scorecard</button>`:""}</div>`,true);
  scLiveUpdate(); }
function scRead(){ const inputs={}; SC.forEach(d=>{ const reason=($(`#scr_${d.k}`)?.value||"").trim(); let v="";
  if(d.type==="pick") v=document.querySelector(`[data-act="sc20-pick"][data-k="${d.k}"].on`)?.dataset.v||""; else v=($(`#sc_${d.k}`)?.value||"").trim().replace(",",".");
  if(v!==""||reason) inputs[d.k]={v,reason}; }); return inputs; }
function scLiveUpdate(){ const box=$("#scLive"); if(!box) return; const s=scoreOf({scorecard:{inputs:scRead()}}); const v=VERD[s.verdict];
  SC.forEach(d=>{ if(d.type!=="num") return; const r=scLine(d,{v:$(`#sc_${d.k}`)?.value}); const el=$(`#scp_${d.k}`); if(el){ el.textContent= r? (r.kill?"kill":r.flag?"red flag":`${r.pts} pts`) : ""; el.className= r&&(r.kill||r.flag)?"red":""; } });
  box.innerHTML=`<div class="scsum"><div class="scnum ${v.cls}">${s.total}<small>/100</small></div><div><div class="scverd ${v.cls}">${v.l}${s.kill?" – EBIT below 10%":""}</div><div class="tag">${s.done} of 10 scored${s.flags.length?" · ⚑ customer concentration red flag":""}</div></div></div>`; }
document.addEventListener("input",e=>{ if(e.target.id && e.target.id.startsWith("sc_")) scLiveUpdate(); });
document.addEventListener("click",async e=>{ const t=e.target.closest('[data-act^="sc20"]'); if(!t) return; e.preventDefault(); e.stopPropagation(); const a=t.dataset.act;
  if(a==="sc20"){ if(!S.readOnly) scModal(t.dataset.id); return; }
  if(a==="sc20-pick"){ const on=t.classList.contains("on"); t.parentElement.querySelectorAll(".chip").forEach(x=>x.classList.remove("on")); if(!on) t.classList.add("on"); scLiveUpdate(); return; }
  const c=S.companies.get(t.dataset.id); if(!c) return; const by=await myName();
  if(a==="sc20-clear"){ confirmBox("Clear the scorecard?","All scores and reasons for this business are removed.","Clear",async()=>{ if(await dbUpdate("companies/"+c.id,{scorecard:{}})){ closeModal(); toast("Scorecard cleared"); try{ renderSheet(); }catch(_){} } }); return; }
  const inputs=scRead(); const s=scoreOf({scorecard:{inputs}}); t.disabled=true;
  const ok=await dbUpdate("companies/"+c.id,{scorecard:{inputs,total:s.total,verdict:s.verdict,by,d:today()}, log:[...(c.log||[]),{d:today(),by,type:"note",text:`Scorecard: ${s.total}/100 – ${VERD[s.verdict].l}${s.kill?" (EBIT below 10%)":""}${s.done<10?` · ${s.done} of 10 scored`:""}`}].slice(-200)});
  t.disabled=false; if(ok){ closeModal(); toast(`Scored ${s.total}/100 – ${VERD[s.verdict].l}`); try{ renderSheet(); }catch(_){} } },true);
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.matches && e.target.matches(".sc20card")) e.target.click(); });
/* the score shows next to the business in lists and in the target meeting pipeline */
function scPill(c){ const s=c&&c.scorecard; if(!s||s.total==null||!s.inputs||!Object.keys(s.inputs).length) return ""; const v=VERD[s.verdict]||VERD.kill; return `<span class="pill scpill ${v.cls}">${s.total} · ${v.l}</span>`; }
{ const base=bizRow; bizRow=function(c){ const h=base(c); const p=scPill(c); if(!p) return h; const i=h.lastIndexOf("</span></span>"); return i<0? h : h.slice(0,i+14)+p+h.slice(i+14); }; }

/* ================= Phase 21: meeting notes live inside the follow-up log (Log → paste Granola / Wispr Flow notes, dated and timed) ================= */
function wordsOf(s){ s=String(s||"").trim(); return s? s.split(/\s+/).length : 0; }
function mnPasteBox(id,val,rows){ return `<div class="lbl" style="margin:12px 4px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px"><span>Meeting notes <span class="tag" style="font-weight:400">– paste from Granola or Wispr Flow</span></span><button type="button" class="btn sm" data-act="mn21-paste" data-for="${id}">${ic("doc",16)} Paste</button></div>
  <textarea id="${id}" rows="${rows||8}" class="mtgnotes" placeholder="Paste the full meeting notes here – the more complete the better. They're saved with this entry, dated and timed.">${esc(val||"")}</textarea><div class="tag mn21count" data-for="${id}" style="margin:4px 4px 0">${wordsOf(val)?`${wordsOf(val)} words`:""}</div>`; }
/* 1. the Log screen gets a meeting-notes box under "What was discussed?" */
{ const base=ciEnhance; ciEnhance=function(rec,isK){ base(rec,isK); const ov=document.querySelector("#modal .ovb"); if(!ov||ov.querySelector("#ci21MN")) return;
  const fld=ov.querySelector("#qNote,#qkNote")?.closest(".fld"); if(!fld) return; fld.insertAdjacentHTML("afterend",`<div id="mn21wrap">${mnPasteBox("ci21MN","",7)}</div>`); }; }
document.addEventListener("click",e=>{ const t=e.target.closest('[data-act="ci19-out"]'); if(!t) return; const w=document.getElementById("mn21wrap"); if(w) w.hidden= t.dataset.k==="attempt"; });
document.addEventListener("input",e=>{ if(!e.target.classList?.contains("mtgnotes")) return; const c=document.querySelector(`.mn21count[data-for="${e.target.id}"]`); if(c){ const n=wordsOf(e.target.value); c.textContent=n?`${n} words`:""; } });
/* saving the log: the notes ride on the new entry, with the exact time */
{ const base=dbUpdate; dbUpdate=async function(path,patch){ const ta=document.querySelector("#modal #ci21MN"); const mn=(ta&&!ta.dataset.saved)? ta.value.replace(/\s+$/,"") : "";
  if(mn && patch && Array.isArray(patch.log) && /^(companies|contacts)\//.test(path)){ const L=patch.log; const e=L[L.length-1];
    if(e && e.d===today()){ ta.dataset.saved="1"; const e2={...e, id:e.id||newId(), mn, mnAt:new Date().toISOString(), mnBy:S.me?.name||e.by||""}; if(e2.type==="note" && /^(Note)?$/.test(actBody(e2))) e2.text="Meeting notes"; patch={...patch, log:[...L.slice(0,-1),e2]}; } }
  return base(path,patch); }; }
/* 2. every log entry with notes shows a button; the Follow-up card links to all notes */
function mnRec(kind,id){ return kind==="c"?S.companies.get(id):S.contacts.get(id); }
function mnTime(e){ return e.mnAt? new Date(e.mnAt).toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit"}) : ""; }
function mnList(rec){ return (rec?.log||[]).map((e,i)=>({e,i})).filter(x=>x.e.mn).sort((a,b)=>((b.e.d||"")+(b.e.mnAt||"")).localeCompare((a.e.d||"")+(a.e.mnAt||""))); }
{ const base=renderSheet; renderSheet=function(){ base(); try{ const sh=document.getElementById("sheet"); if(!sh||!S.sheet) return; const kind=S.sheet.kind==="company"?"c":"k"; const rec=mnRec(kind,S.sheet.id); if(!rec) return;
  sh.querySelectorAll('[data-act="log-edit"]').forEach(el=>{ if(el.querySelector(".mnchip")) return; const e=rec.log?.[Number(el.dataset.i)]; if(!e?.mn) return;
    el.insertAdjacentHTML("beforeend",`<button type="button" class="mnchip" data-act="mn21-view" data-kind="${kind}" data-id="${esc(rec.id)}" data-i="${el.dataset.i}">${ic("doc",15)} Meeting notes · ${wordsOf(e.mn)} words</button>`); });
  const L=mnList(rec); if(!L.length||sh.querySelector(".mnall")) return;
  const btn=`<button class="btn block mnall" data-act="mn21-all" data-kind="${kind}" data-id="${esc(rec.id)}" style="margin-top:10px">${ic("doc",18)} All meeting notes (${L.length})</button>`;
  const fu=[...sh.querySelectorAll(".fsec")].find(f=>f.textContent.trim()==="Follow-up"); const card=fu?.nextElementSibling;
  if(card){ const acts=card.querySelector(".acts"); acts? acts.insertAdjacentHTML("afterend",btn) : card.insertAdjacentHTML("beforeend",btn); return; }
  const anchor=[...sh.querySelectorAll(".fsec")].find(f=>/activity|history|check-in|notes/i.test(f.textContent)); if(anchor) anchor.insertAdjacentHTML("beforebegin",`<div style="margin:6px 0 4px">${btn}</div>`); }catch(err){ console.warn(err); } }; }
/* editing an entry: a button to add or edit its meeting notes */
{ const base=logEditModal; logEditModal=function(kind,id,i){ base(kind,id,i); const e=mnRec(kind,id)?.log?.[i]; const f=document.querySelector("#modal .ovb .fields"); if(!e||!f) return;
  f.insertAdjacentHTML("afterend",`<button class="btn block" style="margin-top:10px" data-act="mn21-edit" data-kind="${kind}" data-id="${esc(id)}" data-i="${i}">${ic("doc",18)} ${e.mn?`Meeting notes (${wordsOf(e.mn)} words) – open`:"+ Add meeting notes to this entry"}</button>`); }; }
function mnHead(rec,e){ return `${fmtD(e.d)}${mnTime(e)?` ${mnTime(e)}`:""} · ${ACT[actType(e)]?.short||""}${e.by?` · ${e.by}`:""}`; }
function mnText(rec,e){ return `${rec.name} – meeting notes\n${mnHead(rec,e)}${actBody(e)&&actBody(e)!=="Meeting notes"?`\n${actBody(e)}`:""}\n\n${e.mn}\n`; }
function mnView(kind,id,i){ const rec=mnRec(kind,id); const e=rec?.log?.[i]; if(!e) return;
  showModal(`${ovHead("Meeting notes",`<button class="hbtn" data-act="close-modal">Close</button>`)}<div class="ovb">
   <p style="margin:0 2px 2px"><b>${esc(rec.name)}</b></p><div class="tag" style="margin:0 2px 10px">${esc(mnHead(rec,e))}</div>
   ${actBody(e)&&actBody(e)!=="Meeting notes"?`<p style="margin:0 2px 10px">${esc(actBody(e))}</p>`:""}
   <div class="card box mtgfull">${esc(e.mn)}</div>
   <div class="tag" style="margin:8px 4px 0">${wordsOf(e.mn)} words · saved by ${esc(e.mnBy||e.by||"")}${e.mnAt?` ${esc(new Date(e.mnAt).toLocaleString("en-ZA",{dateStyle:"medium",timeStyle:"short"}))}`:""}${e.mnEditedAt?` · edited by ${esc(e.mnEditedBy||"")} ${esc(new Date(e.mnEditedAt).toLocaleString("en-ZA",{dateStyle:"medium",timeStyle:"short"}))}`:""}</div>
   <div class="acts" style="margin-top:14px;grid-template-columns:1fr 1fr 1fr">${S.readOnly?"":`<button class="act dark" data-act="mn21-edit" data-kind="${kind}" data-id="${esc(id)}" data-i="${i}">${ic("edit",18)}Edit</button>`}<button class="act" data-act="mn21-copy" data-kind="${kind}" data-id="${esc(id)}" data-i="${i}">${ic("doc",18)}Copy</button><button class="act" data-act="mn21-dl" data-kind="${kind}" data-id="${esc(id)}" data-i="${i}">${ic("dl",18)}Download</button></div></div>`,true); }
function mnEdit(kind,id,i){ const rec=mnRec(kind,id); const e=rec?.log?.[i]; if(!e) return;
  showModal(`${ovHead(e.mn?"Edit meeting notes":"Add meeting notes",`<button class="hbtn" data-act="close-modal">Cancel</button>`)}<div class="ovb">

  showModal(`${ovHead(`Meeting notes (${L.length})`,`<button class="hbtn" data-act="close-modal">Close</button>`)}<div class="ovb">

const mnAllText=rec=>mnList(rec).map(({e})=>mnText(rec,e)).join("\n――――――――――\n\n");
document.addEventListener("click",async ev=>{ const t=ev.target.closest('[data-act^="mn21-"]'); if(!t) return; ev.preventDefault(); ev.stopPropagation(); const a=t.dataset.act, {kind,id}=t.dataset, i=Number(t.dataset.i);
  if(a==="mn21-paste"){ const ta=document.getElementById(t.dataset.for); try{ const txt=await navigator.clipboard.readText(); if(!txt){ toast("Nothing copied yet"); return; } ta.value= ta.value.trim()? ta.value.replace(/\s*$/,"\n\n")+txt : txt; ta.dispatchEvent(new Event("input",{bubbles:true})); toast("Pasted"); }catch(_){ ta?.focus(); toast("Tap in the box and paste (hold → Paste)"); } return; }
  if(a==="mn21-view"){ mnView(kind,id,i); return; }
  if(a==="mn21-edit"){ mnEdit(kind,id,i); return; }
  if(a==="mn21-all"){ mnAll(kind,id); return; }

function netMatches(q){ q=normName(q); if(q.length<2) return []; const words=q.split(" ");
  return G.nodes.filter(n=>{ const L=normName(n.label+" "+(n.sub||"")); return words.every(w=>L.includes(w)); })
    .sort((a,b)=>{ const as=normName(a.label).startsWith(q)?0:1, bs=normName(b.label).startsWith(q)?0:1; return as-bs || (b.deg||0)-(a.deg||0); }); }
/* shortest routes from the chosen dot to each of our team (up to 4 steps) */
function netPaths(src){ const nodes=new Set([src]), edges=new Set(); const adj=new Map(); G.edges.forEach(e=>{ (adj.get(e.a)||adj.set(e.a,[]).get(e.a)).push([e.b,e]); (adj.get(e.b)||adj.set(e.b,[]).get(e.b)).push([e.a,e]); });
  const prev=new Map([[src,null]]); let frontier=[src];
  for(let d=0; d<4 && frontier.length; d++){ const next=[]; for(const n of frontier){ if(n.type==="p"&&n!==src) continue; for(const [m,e] of (adj.get(n)||[])){ if(prev.has(m)) continue; prev.set(m,[n,e]); next.push(m); } } frontier=next; }
  const routes=[]; for(const [n] of prev){ if(n.type!=="p"||n===src) continue; const path=[n]; let cur=n; while(prev.get(cur)){ const [p,e]=prev.get(cur); edges.add(e); nodes.add(p); path.unshift(p); cur=p; } nodes.add(n); routes.push(path); }
  (adj.get(src)||[]).forEach(([m,e])=>{ nodes.add(m); edges.add(e); });
  return {nodes,edges,routes}; }
function netSearchApply(focus){ const q=G.q||""; const res=$("#netRes"); const M=netMatches(q); G.hl=q.length>=2? new Set(M) : null;
  if(res){ res.innerHTML= q.length<2? "" : M.length? `<div class="netshint">${M.length} match${M.length===1?"":"es"} lit up – tap one to see how it connects</div><div class="netschips">${M.slice(0,8).map(n=>`<button class="chip ${G.pick===n.id?"on":""}" data-act="nets-pick" data-id="${esc(n.id)}"><i class="netdot ${n.type}" style="background:${netCol(n)}"></i>${esc(n.label)}</button>`).join("")}</div>` : `<div class="netshint">Nobody called “${esc(q)}” on the map${netFilterOn()||!G.show.k||!G.show.c?" – a filter may be hiding them":""}.</div>`; }
  if(G.pick){ const n=G.byId?.get(G.pick); if(n){ G.sel=n; G.path=netPaths(n); } else { G.pick=null; G.path=null; } } else G.path=null;
  try{ netInfo(); netRouteInfo(); }catch(_){}
  netDraw(); if(focus&&G.pick&&G.sel) netCenter(G.sel); }
function netCol(n){ const v=x=>cssVar(x); return n.type==="p"?v("--ink"):n.type==="k"?v({A:"--tierA",B:"--tierB",C:"--tierC"}[n.tier]||"--tierD"):n.group==="pfirm"?v("--tierB"):v("--ok"); }
function netCenter(n){ const from={...G.t}, k=Math.max(1.2,Math.min(2,G.t.k<1.2?1.5:G.t.k)), to={k, x:-n.x*k, y:-n.y*k}, t0=performance.now();
  const step=now=>{ const p=Math.min(1,(now-t0)/500), e=1-Math.pow(1-p,3); G.t={k:from.k+(to.k-from.k)*e, x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e}; netDraw(); if(p<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
function netRouteInfo(){ const box=$("#netinfo"); if(!box||!G.path||!G.sel||!box.classList.contains("on")) return; box.querySelector(".netroutes")?.remove();
  const R=G.path.routes.sort((a,b)=>a.length-b.length).slice(0,6); const eKind=(a,b)=>{ const e=G.edges.find(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a)); return NET_KIND[e?.kind]||"linked to"; };
  const html= G.sel.type==="p"? "" : `<div class="netroutes"><div class="section-t" style="margin-top:6px">How we're connected</div>${R.length? R.map(p=>`<div class="netroute">${p.map((n,i)=>`${i?`<span class="tag"> ${esc(eKind(p[i-1],n))} </span>`:""}<b>${esc(n.label)}</b>`).join("")}</div>`).join("") : `<span class="tag">No route to our team yet – link someone who knows them.</span>`}</div>`;
  const conn=[...box.querySelectorAll(".section-t")].find(x=>/Connected to/.test(x.textContent)); if(conn) conn.insertAdjacentHTML("beforebegin",html); else box.insertAdjacentHTML("beforeend",html); }
{ const base=netInfo; netInfo=function(){ base(); if(!G.sel){ G.pick=null; G.path=null; } else if(G.pick!==G.sel.id){ G.pick=G.sel.id; G.path=netPaths(G.sel); } try{ netRouteInfo(); }catch(_){} }; }
/* drawing: search matches glow, the chosen dot's routes to our team stay lit */
{ const base=netDraw; netDraw=function(){ const cv=$("#net"); if(!cv||!G.w) return base();
  const lit=G.path?.nodes||G.hl; if(!lit) return base();
  const ctx=cv.getContext("2d"); ctx.clearRect(0,0,G.w,G.h); const ink=cssVar("--ink"), line=cssVar("--line"), surface=cssVar("--surface"), muted=cssVar("--muted"), glow=cssVar("--warn");
  ctx.save(); ctx.translate(G.w/2+G.t.x, G.h/2+G.t.y); ctx.scale(G.t.k,G.t.k);
  const pe=G.path?.edges;
  for(const e of G.edges){ const on=pe? pe.has(e) : (lit.has(e.a)&&lit.has(e.b)); ctx.globalAlpha=on?1:.07; ctx.strokeStyle=on?(e.kind==="family"?cssVar("--tierA"):ink):line; ctx.lineWidth=(on?2.2:1)/G.t.k; ctx.setLineDash(e.kind==="lead"||e.kind==="captured"?[4/G.t.k,4/G.t.k]:[]); ctx.beginPath(); ctx.moveTo(e.a.x,e.a.y); ctx.lineTo(e.b.x,e.b.y); ctx.stroke(); }
  ctx.setLineDash([]);
  const hit=n=>lit.has(n); const match=n=>G.hl&&G.hl.has(n);
  for(const n of G.nodes){ const on=hit(n); ctx.globalAlpha=on?1:.15;
    if(on&&(match(n)||n===G.sel)){ ctx.save(); ctx.globalAlpha=.35; ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(n.x,n.y,n.r+9/G.t.k+4,0,Math.PI*2); ctx.fill(); ctx.restore(); ctx.globalAlpha=1; }
    ctx.fillStyle=netCol(n); ctx.beginPath(); if(n.type==="c"){ const s=n.r*.9; ctx.rect(n.x-s,n.y-s,s*2,s*2); } else ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=n===G.sel?glow:(n.type==="p"?line:surface); ctx.lineWidth=(n===G.sel?4:n.type==="p"?3:1.5)/G.t.k; ctx.stroke(); }
  ctx.textAlign="center"; ctx.textBaseline="top";
  for(const n of G.nodes){ if(!hit(n)) continue; ctx.globalAlpha=1; const big=n===G.sel||match(n); const fs=(big?13:11.5)/Math.max(G.t.k,.6); ctx.font=`${big?700:500} ${fs}px "Source Serif 4", Georgia, serif`; const txt=n.label.length>28?n.label.slice(0,27)+"…":n.label; ctx.lineWidth=3/G.t.k; ctx.strokeStyle=surface; ctx.strokeText(txt,n.x,n.y+n.r+3/G.t.k); ctx.fillStyle=big?ink:muted; ctx.fillText(txt,n.x,n.y+n.r+3/G.t.k); }
  ctx.restore(); ctx.globalAlpha=1; }; }
let netQT=null;
document.addEventListener("input",e=>{ if(e.target.id!=="netQ") return; G.q=e.target.value.trim(); G.pick=null; G.sel=null; document.querySelector(".netsx")?.toggleAttribute("hidden",!G.q); clearTimeout(netQT); netQT=setTimeout(()=>{ netSearchApply(false); const M=G.hl?[...G.hl]:[]; if(M.length&&M.length<=40 && G.t){ /* frame the matches */ let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity; M.forEach(n=>{x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y);}); if(M.length===1){ netCenter(M[0]); } } },160); });
document.addEventListener("keydown",e=>{ if(e.target.id!=="netQ"||e.key!=="Enter") return; e.preventDefault(); const M=netMatches(G.q||""); if(M[0]){ G.pick=M[0].id; e.target.blur(); netSearchApply(true); } });
document.addEventListener("click",e=>{ const t=e.target.closest('[data-act="nets-pick"],[data-act="nets-clear"]'); if(!t) return; e.preventDefault(); e.stopPropagation();
  if(t.dataset.act==="nets-clear"){ G.q=""; G.pick=null; G.sel=null; G.hl=null; G.path=null; const i=$("#netQ"); if(i) i.value=""; t.hidden=true; netSearchApply(false); netFit(true); return; }
  G.pick=t.dataset.id; netSearchApply(true); },true);

init();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").then(reg=>{ document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") reg.update().catch(()=>{}); }); setInterval(()=>reg.update().catch(()=>{}),30*60*1000); }).catch(()=>{}); });
  let swReloaded=false; const hadCtl=!!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(!hadCtl||swReloaded) return; swReloaded=true; if(!document.querySelector("#modal.on")) location.reload(); else toast("A new version of Munger is ready – it loads next time you open the app"); }); }
</script>
