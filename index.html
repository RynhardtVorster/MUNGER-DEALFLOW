document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act, k=t.dataset.k, id=t.dataset.id;
  switch(a){
    case "complete-profile": contactForm(id); break;
    case "like": likeModal(id); break;
    case "like-save": { const c=S.companies.get(id); if(!c) break; const by=await myName(); const was=grp(c);
      const patch={followUpMonths:Number($("#lkCad").value)||3, nextCheckIn:$("#lkDate").value||addMonths(today(),3), partner:$("#lkPartner").value};
      if(!isPartnerCo(c)&&(was==="network"||was==="closed")){ patch.status="target"; patch.log=[...(c.log||[]),{d:today(),by,text:"★ We like it – now a target"}].slice(-200); }
      if(await dbUpdate("companies/"+id,patch)){ closeModal(); toast(was==="network"?"Now a target":"Check-ins updated"); } break; }
    case "not-for-us": { const c=S.companies.get(id); const by=await myName(); if(await dbUpdate("companies/"+id,{status:"passed", nextCheckIn:"", log:[...(c.log||[]),{d:today(),by,text:"Not for us"}].slice(-200)})) toast("Marked not for us"); break; }
    case "start-deal": { const c=S.companies.get(id); const by=await myName(); if(await dbUpdate("companies/"+id,{status:"talks", log:[...(c.log||[]),{d:today(),by,text:"Started a conversation – now an active deal"}].slice(-200)})) toast("Now an active deal"); break; }
    case "biz-network": S.f.group="network"; break;
    case "person-at": { const c=S.companies.get(id); contactForm(null,{companyId:id, firm:"", industry:c?.industry||"", town:c?.town||"", province:c?.province||""}); break; }
    case "ask-ex": $("#askQ").value=k; runAsk(k); break;
    case "meet-start": { const {error}=await sb.from("meetings").insert({held_on:today()}); if(error) writeErr(error); else { await loadMeetings(); toast("Meeting started"); } break; }
    case "meet-finish": { const notes=$("#mtNotes")?.value||""; const {error}=await sb.from("meetings").update({status:"done", notes}).eq("id",id); if(error) writeErr(error); else { await loadMeetings(); const m=S.meetings.find(x=>x.id===id); toast("Meeting saved"); if(m) showOut("Minutes", minutesText(m)); } break; }
    case "meet-copy": { const m=S.meetings.find(x=>x.id===id); if(m){ const notes=$("#mtNotes")?.value||m.notes; copyText(minutesText({...m,notes})); } break; }
    case "meet-minutes": { const m=S.meetings.find(x=>x.id===id); if(m) showOut("Minutes · "+fmtD(m.held_on), minutesText(m)); break; }
    case "decide": decide(id,k); break;
    case "cmt-add": { const action=$("#cmAction").value.trim(); if(!action){ toast("Write the action first"); break; } const m=openMeeting();
      const {error}=await sb.from("commitments").insert({owner:$("#cmOwner").value, action, due:$("#cmDue").value||null, company_id:$("#cmBiz").value||null, meeting_id:m?.id||null}); if(error) writeErr(error); else { await loadCommitments(); toast("Commitment added"); } break; }
    case "cmt-done": { const {error}=await sb.from("commitments").update({status:"done"}).eq("id",id); if(error) writeErr(error); else { await loadCommitments(); toast("Done. Nice."); } break; }
    case "cmt-not": showModal(`${ovHead("Not done",`<button class="hbtn" data-act="close-modal">Cancel</button>`)}<div class="ovb"><div class="fields"><div class="fld"><label for="cmWhy">Why not? (honest report)</label><textarea id="cmWhy" rows="3"></textarea></div></div><div style="margin-top:12px"><button class="btn primary block" data-act="cmt-not-save" data-id="${esc(id)}">Save</button></div></div>`, true); break;
    case "cmt-not-save": { const {error}=await sb.from("commitments").update({status:"not_done", why:$("#cmWhy").value.trim()}).eq("id",id); if(error) writeErr(error); else { closeModal(); await loadCommitments(); toast("Recorded"); } break; }
  }
});

GAZ.forEach((g,k)=>{ if(!PLACES[k]) PLACES[k]=[k, g.region.toLowerCase()]; });
function gazFind(s){ s=String(s||"").trim().toLowerCase(); if(!s) return null; return GAZ.get(s)||GAZ.get(GAZ_ALIAS[s])||null; }
function geoOf(town, province, country){ const g=gazFind(town); if(g) return {lat:g.lat,lng:g.lng,exact:true,label:g.name}; const pc=PROV_C[province]; if(pc) return {lat:pc[0],lng:pc[1],exact:false,label:province}; const cc=country&&country!=="South Africa"? gazFind(({Namibia:"windhoek",Botswana:"gaborone",Eswatini:"mbabane",Lesotho:"maseru",Zimbabwe:"harare",Mozambique:"maputo",Zambia:"lusaka",Malawi:"lilongwe",Kenya:"nairobi",Mauritius:"port louis"})[country]||"") : null; return cc? {lat:cc.lat,lng:cc.lng,exact:false,label:country} : null; }
function geoK(k){ return geoOf(k.town,k.province,k.country) || (companyOf(k)? geoC(companyOf(k)) : null); }
function geoC(c){ return geoOf(c.town,c.province,c.hqCountry); }
function distKm(a,b){ const R=6371, t=x=>x*Math.PI/180; const dl=t(b.lat-a.lat), dn=t(b.lng-a.lng); const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function townList(){ return `<datalist id="townList">${GAZ_LIST.map(g=>`<option value="${esc(g[0])}">${esc(g[3])}</option>`).join("")}</datalist>`; }
function autoProvince(town, province){ if(province) return province; const g=gazFind(town); return g && PROVINCES.includes(g.region)? g.region : province; }

function activeChannels(cur){ return CHANNELS.filter(c=>!c.archived||c.id===cur); }

/* ---------- Voice typing ---------- */
let REC=null, REC_BTN=null;
function voiceLang(){ try{ return localStorage.getItem("munger-voice")||"en-ZA"; }catch(e){ return "en-ZA"; } }
function micBtn(target){ return `<button type="button" class="mic" data-act="mic" data-for="${target}" aria-label="Speak instead of typing">${ic("mic",18)}<span>Speak</span></button>`; }
function startMic(btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(REC){ try{ REC.stop(); }catch(e){} return; }
  const ta=document.getElementById(btn.dataset.for); if(!ta) return;
  if(!SR){ toast("Tap the microphone on your keyboard to dictate"); ta.focus(); return; }
  const r=new SR(); r.lang=voiceLang(); r.continuous=true; r.interimResults=true;
  const base=ta.value? ta.value.replace(/\s*$/,"")+" " : ""; let fin="";
  r.onresult=e=>{ let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) fin+=t.trim()+" "; else interim+=t; } ta.value=(base+fin+interim).replace(/\s+$/," "); ta.dispatchEvent(new Event("input",{bubbles:true})); };
  r.onerror=ev=>{ if(ev.error==="not-allowed"||ev.error==="service-not-allowed") toast("Voice isn't allowed here. Tap the microphone on your keyboard instead."); };
  r.onend=()=>{ REC=null; if(REC_BTN) REC_BTN.classList.remove("rec"); REC_BTN=null; ta.value=ta.value.trim(); ta.dispatchEvent(new Event("input",{bubbles:true})); };
  REC=r; REC_BTN=btn; btn.classList.add("rec");
  try{ r.start(); toast("Listening… tap Stop when done"); }catch(e){ REC=null; btn.classList.remove("rec"); toast("Tap the microphone on your keyboard to dictate"); }
}
function fldNote(id,label,value,ph,rows){ return `<div class="fld"><div class="fldh"><label for="${id}">${label}</label>${micBtn(id)}</div><textarea id="${id}" rows="${rows||3}" placeholder="${ph||""}">${esc(value||"")}</textarea></div>`; }

/* ---------- Businesses (acquisitions vs banks & funders) ---------- */
function filteredDeals(){
  const f=S.f, q=f.q.trim().toLowerCase(); const kind=S.view==="funders"?"financier":"target";
  return companies().filter(c=>{
    if(kind==="financier"? !isPartnerCo(c) : isPartnerCo(c)) return false;
    const g=grp(c);
    if(kind!=="financier"){ if(f.group==="likely"){ if(!likelySeller(c)||g==="closed"||g==="won") return false; } else if(f.group && g!==f.group) return false; }
    if(f.mine && !isMine(c)) return false;
    if(f.sector && sectorOf(c)!==f.sector) return false;
    if(f.partner && c.partner!==f.partner) return false;
    if(f.province && c.province!==f.province) return false;
    if(f.channel && c.source?.channel!==f.channel) return false;
    if(f.lang){ const ls=companyLangs(c); if(!(ls.includes(f.lang)||ls.includes("both"))) return false; }
    if(q){ const hay=[c.name,c.tradingAs,c.town,c.province,c.industry,c.notes,c.partner,sourceText(c),...(c.owners||[]).flatMap(o=>[o.name,o.email,o.cell]),...peopleAt(c).map(k=>k.name)].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  }).sort((a,b)=>{ if(kind==="financier") return peopleAt(b).length-peopleAt(a).length || a.name.localeCompare(b.name); const x=a.nextCheckIn||"9999", y=b.nextCheckIn||"9999"; return x.localeCompare(y) || (a.name||"").localeCompare(b.name||""); });
}

async function loadHistory(id){

function histBlock(id, updatedAt, by){ if(!S.hist[id] || Date.now()-S.hist[id].at>20000) setTimeout(()=>loadHistory(id),0);
  return `<div class="fsec">Last updated</div><div class="card box" style="gap:2px"><div><b>${esc(fmtD(String(updatedAt||"").slice(0,10)))}</b>${by?` by ${esc(by)}`:""}</div></div><details class="histd"><summary>${ic("history",16)} Change history</summary><div class="group log" id="hist-${esc(id)}" style="margin-top:8px">${histHTML(id)}</div></details>`; }

/* ---------- Warmest way in ---------- */
const REL_W={friend:3,family:3,business:2,acquaintance:1,"":1};
function wayIn(c){
  const routes=[];
  peopleAt(c).forEach(k=>knowers(k).forEach(x=>routes.push({w:REL_W[x.relation]*2+(OWNER_ROLES.includes(k.companyRole)?2:0), partner:x.partner, via:null, to:k, txt:`${RELS[x.relation]||"knows"}`})));
  const sk=c.source?.contactId? S.contacts.get(c.source.contactId) : null;
  if(sk && !peopleAt(c).includes(sk)) knowers(sk).forEach(x=>routes.push({w:REL_W[x.relation]+1, partner:x.partner, via:sk, to:null, txt:"introduced it"}));
  const g=geoC(c); const sect=sectorOf(c);
  contacts().filter(k=>tierOf(k)==="B" && k.id!==sk?.id && !peopleAt(c).includes(k) && knowers(k).length).map(k=>{ const gk=geoK(k); const d=g&&gk? distKm(g,gk) : 9999; const ind=sect && (k.industry||"").startsWith(sect); return {k,d,ind}; }).filter(r=>r.d<=80||r.ind).sort((a,b)=>(b.ind-a.ind)||(a.d-b.d)).slice(0,3)
    .forEach(r=>knowers(r.k).slice(0,1).forEach(x=>routes.push({w:REL_W[x.relation]*0.5, partner:x.partner, via:r.k, to:null, txt:`could introduce${r.d<9999?` (${Math.round(r.d)} km away)`:""}${r.ind?" · same industry":""}`, possible:true})));
  return routes.sort((a,b)=>b.w-a.w).slice(0,6);
}
function wayInHTML(c){
  const r=wayIn(c);
  if(!r.length) return `<div class="card box tag">No way in yet. Add the people we know here, or ask the B connectors near ${esc(c.town||"this business")} for an introduction.</div>`;
  return `<div class="group">${r.map(x=>`<div class="rowi" style="min-height:54px"><span class="main"><span class="t1 route" style="display:block;white-space:normal">${esc(x.partner)} → ${x.via?`<a href="#" data-contact="${esc(x.via.id)}">${esc(x.via.name)}</a>${x.to?" → ":""}`:""}${x.to?`<a href="#" data-contact="${esc(x.to.id)}">${esc(x.to.name)}</a>`:x.via?"":""}${!x.via&&!x.to?"":""}${!x.via&&x.to?"":""}${x.via&&!x.to?` → ${esc(c.name)}`:""}</span><span class="t2" style="display:block">${esc(x.to?`${x.to.companyRole||"works here"} · ${x.txt}`:x.txt)}</span></span>${x.possible?`<span class="pill">Possible</span>`:`<span class="pill ${x.w>=6?"won":"soon"}">${x.w>=6?"Warm":"OK"}</span>`}</div>`).join("")}</div>`;
}

function filteredDeals(){

    if(f.partner && c.partner!==f.partner) return false;

const last9=s=>String(s||"").replace(/\D/g,"").slice(-9);
async function syncOwnersToPeople(cid, owners, biz, skipId){
  let made=0;
  for(const o of owners||[]){
    const nm=String(o.name||"").trim(); if(!nm) continue;
    const ph=last9(o.cell), em=String(o.email||"").toLowerCase();
    const same=contacts().find(k=>k.id===skipId && k.name.toLowerCase()===nm.toLowerCase()) || contacts().find(k=>(k.companyId===cid||k.ownsCompanyId===cid) && k.name.toLowerCase()===nm.toLowerCase()) || contacts().find(k=>(ph.length===9&&last9(k.cell)===ph)||(em&&String(k.email||"").toLowerCase()===em));

    const ok=await dbSet("contacts/"+newId(),{name:nm, tier:"A", type:"Business owner", companyId:cid, companyRole:o.role||"Owner", ownsCompanyId:cid, firm:"", cell:o.cell||"", email:o.email||"", language:o.language||"af", partner:biz.partner||"", town:biz.town||"", province:biz.province||"", country:biz.hqCountry||"South Africa", influence:0, notes:""});

}

  return `<div class="ph"><div><h1>Network map</h1><p>Our team, everyone we know, the partner firms they work at and the businesses we want. Pinch to zoom, drag to move, tap a dot.</p></div></div>

  <div class="netwrap" id="netwrap"><canvas id="net" aria-label="Network map of partners, people and businesses"></canvas>
  <div class="netctl"><button data-netz="in" aria-label="Zoom in">+</button><button data-netz="out" aria-label="Zoom out">−</button><button data-netz="fit" aria-label="Show the whole network">${ic("net",18)}</button><button data-netz="full" aria-label="Full screen">⤢</button></div>
  <div class="netcount" id="netcount"></div>
  <div class="legend"><span><i style="background:var(--ink)"></i>Our team</span><span><i style="background:var(--tierA)"></i>A · Owner</span><span><i style="background:var(--tierB)"></i>B · Connector</span><span><i style="background:var(--tierC)"></i>C · Potential hire</span><span><i style="background:var(--tierD)"></i>D · Great contact</span><span><i class="sq" style="background:var(--ok)"></i>Business</span><span><i class="sq" style="background:var(--tierB)"></i>Partner firm</span></div>
  <div class="netinfo" id="netinfo"></div></div>`;
}
const NET_KMIN=0.04, NET_KMAX=5;
function netFit(animate){
  if(!G.nodes.length||!G.w) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const n of G.nodes){ x0=Math.min(x0,n.x-n.r); y0=Math.min(y0,n.y-n.r); x1=Math.max(x1,n.x+n.r); y1=Math.max(y1,n.y+n.r+14); }
  const pad=28, k=Math.min(NET_KMAX, Math.max(NET_KMIN, Math.min((G.w-pad*2)/Math.max(1,x1-x0), (G.h-pad*2-40)/Math.max(1,y1-y0))));
  const to={k, x:-((x0+x1)/2)*k, y:-((y0+y1)/2)*k - 10};
  if(!animate){ G.t=to; netDraw(); return; }
  const from={...G.t}, t0=performance.now();
  const step=now=>{ const p=Math.min(1,(now-t0)/450), e=1-Math.pow(1-p,3); G.t={k:from.k+(to.k-from.k)*e, x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e}; netDraw(); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function netZoomAt(sx,sy,k){ k=Math.min(NET_KMAX,Math.max(NET_KMIN,k)); const wx=(sx-G.w/2-G.t.x)/G.t.k, wy=(sy-G.h/2-G.t.y)/G.t.k; G.t.k=k; G.t.x=sx-G.w/2-wx*k; G.t.y=sy-G.h/2-wy*k; netDraw(); }
function netCount(){ const el=$("#netcount"); if(!el) return; const p=G.nodes.filter(n=>n.type==="p").length, k=G.nodes.filter(n=>n.type==="k").length, c=G.nodes.filter(n=>n.type==="c").length; el.textContent=`${p} team · ${k} people · ${c} firms & businesses · ${G.edges.length} links`; }
function netInit(){
  const cv=$("#net"); if(!cv) return;
  G.byId=new Map(); G.t={x:0,y:0,k:1}; G.sel=null; G.fitted=false;
  netBuildGraph(); netSize(); G.alpha=1; netLoop(); netCount();
  setTimeout(()=>{ if(!G.fitted){ G.fitted=true; netFit(true); } },1400);
  const ro=new ResizeObserver(()=>{ netSize(); netDraw(); }); ro.observe(cv); G.ro=ro;
  const pt=e=>{ const r=cv.getBoundingClientRect(); return {sx:e.clientX-r.left, sy:e.clientY-r.top}; };
  const toW=(sx,sy)=>({x:(sx-G.w/2-G.t.x)/G.t.k, y:(sy-G.h/2-G.t.y)/G.t.k});
  const hit=(sx,sy)=>{ const w=toW(sx,sy); let best=null,bd=Infinity; for(const n of G.nodes){ const d=Math.hypot(n.x-w.x,n.y-w.y); if(d<n.r+10/G.t.k && d<bd){bd=d;best=n;} } return best; };
  const ptrs=new Map(); let pinch=null;
  const pinchState=()=>{ const [a,b]=[...ptrs.values()]; return {d:Math.hypot(a.sx-b.sx,a.sy-b.sy)||1, cx:(a.sx+b.sx)/2, cy:(a.sy+b.sy)/2}; };
  cv.addEventListener("pointerdown",e=>{ cv.setPointerCapture(e.pointerId); const p=pt(e); ptrs.set(e.pointerId,p);
    if(ptrs.size===2){ if(G.drag?.n) G.drag.n.fixed=false; G.drag=null; const s=pinchState(); pinch={...s, k:G.t.k, tx:G.t.x, ty:G.t.y}; return; }
    if(ptrs.size>2) return;
    const n=hit(p.sx,p.sy); G.drag={n, sx:p.sx, sy:p.sy, moved:false, tx:G.t.x, ty:G.t.y}; cv.style.cursor="grabbing"; });
  cv.addEventListener("pointermove",e=>{ const p=pt(e); if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,p);
    if(pinch && ptrs.size>=2){ const s=pinchState(); const k=Math.min(NET_KMAX,Math.max(NET_KMIN,pinch.k*s.d/pinch.d));
      const wx=(pinch.cx-G.w/2-pinch.tx)/pinch.k, wy=(pinch.cy-G.h/2-pinch.ty)/pinch.k;
      G.t.k=k; G.t.x=s.cx-G.w/2-wx*k; G.t.y=s.cy-G.h/2-wy*k; netDraw(); return; }
    if(G.drag){ const dx=p.sx-G.drag.sx, dy=p.sy-G.drag.sy; if(Math.abs(dx)+Math.abs(dy)>4) G.drag.moved=true;
      if(G.drag.n){ if(!G.drag.moved) return; const w=toW(p.sx,p.sy); G.drag.n.x=w.x; G.drag.n.y=w.y; G.drag.n.fixed=true; G.alpha=Math.max(G.alpha,.3); netLoop(); }
      else { G.t.x=G.drag.tx+dx; G.t.y=G.drag.ty+dy; netDraw(); } }
    else if(e.pointerType==="mouse"){ const n=hit(p.sx,p.sy); if(n!==G.hover){ G.hover=n; cv.style.cursor=n?"pointer":"grab"; netDraw(); } } });
  const up=e=>{ ptrs.delete(e.pointerId); if(pinch){ if(ptrs.size<2) pinch=null; G.drag=null; return; }
    const D=G.drag; G.drag=null; cv.style.cursor="grab"; if(D&&D.n) D.n.fixed=false; if(D&&!D.moved&&e.type==="pointerup"){ G.sel=D.n||null; netInfo(); netDraw(); } };
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
  cv.addEventListener("wheel",e=>{ e.preventDefault(); const p=pt(e); netZoomAt(p.sx,p.sy,G.t.k*Math.exp(-e.deltaY*.0015)); },{passive:false});
  cv.addEventListener("dblclick",e=>{ const p=pt(e); netZoomAt(p.sx,p.sy,G.t.k*1.8); });
  document.querySelectorAll("[data-net]").forEach(b=>b.addEventListener("click",()=>{ const k=b.dataset.net; G.show[k]=!G.show[k]; b.classList.toggle("on",G.show[k]); netBuildGraph(); netCount(); G.alpha=.8; netLoop(); setTimeout(()=>netFit(true),1000); }));
  document.querySelectorAll("[data-netz]").forEach(b=>b.addEventListener("click",()=>{ const z=b.dataset.netz;
    if(z==="in") netZoomAt(G.w/2,G.h/2,G.t.k*1.5);
    if(z==="out") netZoomAt(G.w/2,G.h/2,G.t.k/1.5);
    if(z==="fit"){ G.sel=null; netInfo(); netFit(true); }
    if(z==="full"){ const w=$("#netwrap"); const on=!w.classList.contains("full"); w.classList.toggle("full",on); document.body.classList.toggle("netfull",on); document.documentElement.classList.toggle("netdark",on); b.textContent=on?"✕":"⤢"; b.setAttribute("aria-label",on?"Exit full screen":"Full screen"); setTimeout(()=>{ netSize(); netFit(false); },60); setTimeout(()=>{ netSize(); netFit(true); },350); }
  }));
  netInfo();
}
window.addEventListener("hashchange",()=>{ document.body.classList.remove("netfull"); document.documentElement.classList.remove("netdark"); });

init();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
